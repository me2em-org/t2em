# Production deploy — ships ONLY from main (ТЗ §3.4 mode 1, §8.8).
# Development happens on develop; a merge to main is the release act:
# this workflow gates on the same quality checks as CI, then deploys
# the Blind Relay to Cloudflare Workers (t2em-relay.siteup24.workers.dev,
# later t2em.com).
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts:Edit.
# Upstash secrets (UPSTASH_REDIS_REST_URL / _TOKEN) live on the Worker
# and persist across deploys, so wrangler never needs them here.
#
# If CLOUDFLARE_API_TOKEN is not yet configured, the deploy step exits
# with a warning instead of failing, so main stays green until the
# secret lands; the next push/merge to main (or a manual re-run via
# workflow_dispatch) ships the release.
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-and-deploy:
    name: Quality gates → Cloudflare Workers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm version comes from the root package.json packageManager
      # field (single source of truth — pnpm@10.11.1)
      - uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm -r lint

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Check for CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CF_SECRET_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Repository secret CLOUDFLARE_API_TOKEN is not set — deploy skipped. Add it in Settings → Secrets and variables → Actions, then re-run this workflow (Actions → deploy → Run workflow)."
            echo "CF_SECRET_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CF_SECRET_PRESENT == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config infra/wrangler.jsonc
